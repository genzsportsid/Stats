<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TSL Pro Stat-Maker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'night': '#0D1512', 'panel': '#131F1A', 'panel2': '#17251F',
                        'hairline': '#24352C', 'primary': '#F5F7F5', 'brand-green': '#009A44',
                        'brand-gold': '#d7b67d', 'contest': '#6B7280'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0D1512; color: #F5F7F5; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: contain; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .stat-btn { transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1); }
        .stat-btn:active { transform: scale(0.85); }
        .loader { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #009A44; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .poss-bar { transition: width 0.3s ease-out; }
        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.4); color: #009A44; } 100% { transform: scale(1); } }
        .animate-pop { animation: pop 0.3s ease-out; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- LAYAR PERTAMA: SETUP TERMINAL -->
    <div id="screen-setup" class="flex-1 flex flex-col items-center justify-center p-4 sm:p-6 max-w-lg mx-auto w-full">
        <div class="mb-6 text-center">
            <h1 class="text-2xl sm:text-3xl font-black uppercase tracking-widest text-brand-green flex items-center justify-center gap-2">
                <i data-lucide="bar-chart-2" class="w-7 h-7 sm:w-8 sm:h-8"></i> STAT-MAKER
            </h1>
            <p class="text-[10px] sm:text-xs text-gray-500 font-bold uppercase tracking-widest mt-1">Sistem Statistik Terdistribusi TSL</p>
        </div>

        <div id="resume-container" class="w-full mb-6 hidden">
            <div class="bg-brand-gold/10 border border-brand-gold/40 p-4 rounded-2xl text-center">
                <p class="text-xs text-brand-gold font-bold mb-3 uppercase tracking-widest">Sesi Sebelumnya Ditemukan!</p>
                <button onclick="resumeSession()" class="w-full bg-brand-gold text-black font-black text-xs uppercase tracking-widest py-3 rounded-xl hover:bg-yellow-500 transition-colors shadow-[0_0_15px_rgba(215,182,125,0.3)]">
                    <i data-lucide="rotate-ccw" class="w-4 h-4 inline mr-1 pb-0.5"></i> Lanjutkan Sesi Sebelumnya
                </button>
                <button onclick="clearSession()" class="w-full text-[10px] text-gray-400 font-bold uppercase tracking-widest mt-3 hover:text-red-400">
                    Atau Hapus & Buat Sesi Baru
                </button>
            </div>
        </div>

        <div id="loading-setup" class="flex flex-col items-center py-10 hidden">
            <div class="loader mb-4"></div>
            <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">Sinkronisasi Jadwal...</p>
        </div>

        <div id="form-setup" class="w-full space-y-5 bg-panel border border-hairline p-5 sm:p-6 rounded-2xl shadow-xl">
            <div>
                <label class="block text-[10px] sm:text-xs text-gray-400 font-bold uppercase mb-2">1. Pilih Laga Aktif</label>
                <select id="select-match" onchange="updateSetupTeams()" class="w-full bg-night border border-hairline rounded-xl px-4 py-3.5 text-xs sm:text-sm font-bold uppercase outline-none focus:border-brand-green transition-colors text-brand-gold truncate">
                    <option value="">-- MEMUAT DATA... --</option>
                </select>
            </div>
            
            <div>
                <label class="block text-[10px] sm:text-xs text-gray-400 font-bold uppercase mb-2">2. Pilih Peran Terminal (Role)</label>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <label class="flex items-center gap-3 p-3 border border-hairline bg-night rounded-xl cursor-pointer hover:border-brand-green transition-colors">
                        <input type="radio" name="role" value="possession" class="w-4 h-4 text-brand-green accent-brand-green shrink-0" checked>
                        <div>
                            <span class="block text-[10px] sm:text-[11px] font-bold uppercase">⏱️ Penguasaan</span>
                            <span class="block text-[8px] sm:text-[9px] text-gray-500 font-medium">Timer & Ball Possession</span>
                        </div>
                    </label>
                    <label class="flex items-center gap-3 p-3 border border-hairline bg-night rounded-xl cursor-pointer hover:border-brand-green transition-colors">
                        <input type="radio" name="role" value="teama" class="w-4 h-4 text-brand-green accent-brand-green shrink-0">
                        <div>
                            <span class="block text-[10px] sm:text-[11px] font-bold uppercase text-blue-400 truncate w-32" id="label-role-a">🛡️ Tim Kiri</span>
                            <span class="block text-[8px] sm:text-[9px] text-gray-500 font-medium">Panel Tunggal Tim Kiri</span>
                        </div>
                    </label>
                    <label class="flex items-center gap-3 p-3 border border-hairline bg-night rounded-xl cursor-pointer hover:border-brand-green transition-colors">
                        <input type="radio" name="role" value="teamb" class="w-4 h-4 text-brand-green accent-brand-green shrink-0">
                        <div>
                            <span class="block text-[10px] sm:text-[11px] font-bold uppercase text-red-400 truncate w-32" id="label-role-b">⚔️ Tim Kanan</span>
                            <span class="block text-[8px] sm:text-[9px] text-gray-500 font-medium">Panel Tunggal Tim Kanan</span>
                        </div>
                    </label>
                    <label class="flex items-center gap-3 p-3 border border-hairline bg-night rounded-xl cursor-pointer hover:border-brand-green transition-colors">
                        <input type="radio" name="role" value="twoteams" class="w-4 h-4 text-brand-green accent-brand-green shrink-0">
                        <div>
                            <span class="block text-[10px] sm:text-[11px] font-bold uppercase text-purple-400">⚖️ Operator 2 Tim</span>
                            <span class="block text-[8px] sm:text-[9px] text-gray-500 font-medium">H2H View (Tanpa Timer)</span>
                        </div>
                    </label>
                    <label class="flex items-center gap-3 p-3 border border-hairline bg-night rounded-xl cursor-pointer hover:border-brand-gold transition-colors sm:col-span-2">
                        <input type="radio" name="role" value="master" class="w-4 h-4 text-brand-gold accent-brand-gold shrink-0">
                        <div>
                            <span class="block text-[10px] sm:text-[11px] font-bold uppercase text-brand-gold">👑 Mode Master (Semua)</span>
                            <span class="block text-[8px] sm:text-[9px] text-gray-500 font-medium">Kendalikan semua panel secara H2H</span>
                        </div>
                    </label>
                </div>
            </div>

            <button onclick="startSession()" class="w-full bg-brand-green text-white font-black text-xs sm:text-sm uppercase tracking-widest py-3.5 sm:py-4 rounded-xl mt-4 shadow-[0_0_15px_rgba(0,154,68,0.3)] hover:bg-green-600 transition-colors">
                Mulai Terminal
            </button>
        </div>
    </div>

    <!-- LAYAR KEDUA: WORKSPACE TRACKER -->
    <div id="screen-tracker" class="hidden flex-1 flex flex-col h-screen overflow-hidden">
        
        <header class="bg-panel border-b border-hairline p-3 md:p-4 flex items-center justify-between shrink-0 z-20 shadow-md">
            <div class="flex flex-col max-w-[40%]">
                <span id="hdr-match-id" class="text-[9px] font-bold text-gray-500 uppercase tracking-widest truncate">MATCH</span>
                <span id="hdr-role" class="text-[10px] sm:text-[11px] font-black text-brand-gold uppercase tracking-wider truncate">ROLE</span>
            </div>
            
            <div class="flex items-center gap-2 sm:gap-4">
                <!-- DROPDOWN PILIHAN BABAK -->
                <select id="select-babak" onchange="changeBabak()" class="bg-night border border-brand-green/30 text-brand-green text-[9px] sm:text-[10px] font-black uppercase tracking-widest rounded-lg px-2 py-2 outline-none focus:border-brand-green shadow-[0_0_10px_rgba(0,154,68,0.2)] transition-colors cursor-pointer">
                    <option value="1">Babak 1</option>
                    <option value="2">Babak 2</option>
                </select>

                <div id="timer-container" class="hidden flex items-center gap-2 bg-night border border-hairline px-2 sm:px-3 py-1.5 rounded-lg">
                    <span id="match-timer" class="text-base sm:text-xl font-black tracking-tighter w-12 sm:w-16 text-center font-mono">00:00</span>
                    <button id="btn-timer" onclick="toggleTimer()" class="stat-btn w-7 h-7 sm:w-8 sm:h-8 shrink-0 rounded-full bg-white text-black flex items-center justify-center hover:bg-brand-green hover:text-white transition-colors">
                        <i data-lucide="play" id="icon-timer" class="w-3 h-3 sm:w-4 sm:h-4 ml-0.5"></i>
                    </button>
                </div>
                
                <button onclick="submitStatsToDB()" id="btn-sync" class="stat-btn bg-brand-green/20 text-brand-green border border-brand-green/50 px-3 py-2 rounded-lg text-[9px] sm:text-[10px] font-bold uppercase tracking-widest flex items-center gap-1.5 hover:bg-brand-green hover:text-white transition-colors">
                    <i data-lucide="cloud-upload" class="w-3.5 h-3.5 shrink-0"></i> <span class="hidden sm:inline">Sync Data</span><span class="sm:hidden">Sync</span>
                </button>
                <button onclick="hardReset()" class="stat-btn bg-red-500/10 text-red-500 border border-red-500/30 px-2.5 py-2 rounded-lg hover:bg-red-500 hover:text-white transition-colors" title="Keluar & Hapus Sesi">
                    <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
                </button>
            </div>
        </header>

        <div id="workspace-container" class="flex-1 overflow-y-auto p-2 sm:p-4 md:p-6 bg-night"></div>
        
        <div id="log-status" class="bg-brand-green text-white text-center text-[10px] sm:text-xs font-bold uppercase tracking-widest p-2 hidden shadow-[0_-5px_15px_rgba(0,154,68,0.3)] z-50">
            Data Berhasil Diunggah!
        </div>
    </div>

    <!-- SCRIPT MESIN LOGIKA -->
    <script>
        lucide.createIcons();
        const API_URL = "https://script.google.com/macros/s/AKfycbzAeXyhA-VIDTJQfmOnPfv0o9NZQXJg9PIk1r1FpSWeqH3TvInjK6QnhONhLieHiqY/exec";
        const STORAGE_KEY = 'TSL_StatMaker_V4_UX';
        
        let matchesData = [];
        let currentMatch = null;
        let activeRole = 'possession';
        let activeBabak = '1';
        let isTimerLoopRunning = false;

        const STAT_DEFS = [
            { key: 'goals',       label: 'Gol', emoji: '⚽' },
            { key: 'shotsOn',     label: 'Tepat Sasaran', emoji: '🎯' },
            { key: 'shotsOff',    label: 'Melenceng', emoji: '↗️' },
            { key: 'corners',     label: 'Corner', emoji: '⛳' },
            { key: 'offsides',    label: 'Offside', emoji: '🚩' },
            { key: 'fouls',       label: 'Pelanggaran', emoji: '🛑' },
            { key: 'yellowCards', label: 'K. Kuning', emoji: '🟨' },
            { key: 'redCards',    label: 'K. Merah', emoji: '🟥' },
            { key: 'saves',       label: 'Penyelamatan', emoji: '🧤' }
        ];

        function createEmptyStats() {
            return { goals: 0, shotsOn: 0, shotsOff: 0, corners: 0, offsides: 0, yellowCards: 0, redCards: 0, fouls: 0, saves: 0, passSuccess: 0, passFail: 0 };
        }

        // Laci memori kosong (Template)
        function createDefaultState() {
            return {
                teamA: createEmptyStats(), teamB: createEmptyStats(),
                // 'O' adalah status default (Bola Out / Belum Kick-off)
                possession: { active: 'O', timeA_ms: 0, timeB_ms: 0, timeN_ms: 0, timeO_ms: 0 },
                timer: { isRunning: false, totalMs: 0, lastTick: 0 }
            };
        }

        let allStates = { '1': createDefaultState(), '2': createDefaultState() };
        let state = allStates[activeBabak];

        // ==============================================
        // FITUR ANTI-DATA LOSS (LOCAL STORAGE)
        // ==============================================
        function saveLocal() {
            allStates[activeBabak] = state;
            localStorage.setItem(STORAGE_KEY, JSON.stringify({ match: currentMatch, role: activeRole, babak: activeBabak, allStates: allStates }));
        }

        function checkLocalSession() {
            if(localStorage.getItem(STORAGE_KEY)) document.getElementById('resume-container').classList.remove('hidden');
        }

        function resumeSession() {
            let raw = localStorage.getItem(STORAGE_KEY);
            if(raw) {
                let data = JSON.parse(raw); 
                currentMatch = data.match; 
                activeRole = data.role;
                activeBabak = data.babak || '1';
                
                if (data.allStates) {
                    allStates = data.allStates;
                } else if (data.state) { 
                    allStates['1'] = data.state; 
                }
                
                state = allStates[activeBabak];
                state.timer.isRunning = false;
                
                document.getElementById('screen-setup').classList.add('hidden');
                document.getElementById('screen-tracker').classList.remove('hidden'); 
                document.getElementById('screen-tracker').classList.add('flex');
                
                let selBabak = document.getElementById('select-babak');
                if(selBabak) selBabak.value = activeBabak;

                buildWorkspace();
                refreshUIfromState();

                if(!isTimerLoopRunning) {
                    requestAnimationFrame(timerLoop);
                    isTimerLoopRunning = true;
                }
            }
        }

        function clearSession() {
            if(confirm('Yakin ingin menghapus sesi sebelumnya?')) { localStorage.removeItem(STORAGE_KEY); document.getElementById('resume-container').classList.add('hidden'); }
        }

        function hardReset() {
            if(confirm('Keluar dari terminal? Pastikan Anda sudah Sync Data.')) { localStorage.removeItem(STORAGE_KEY); window.location.reload(); }
        }

        function changeBabak() {
            if (state.timer.isRunning) toggleTimer(); 
            
            allStates[activeBabak] = state; 
            activeBabak = document.getElementById('select-babak').value;
            
            if (!allStates[activeBabak]) allStates[activeBabak] = createDefaultState();
            
            state = allStates[activeBabak]; 
            saveLocal();
            
            buildWorkspace();
            refreshUIfromState();
        }

        // ==============================================
        // INISIALISASI & SETUP
        // ==============================================
        async function fetchMatches() {
            checkLocalSession();
            document.getElementById('loading-setup').classList.remove('hidden');
            let select = document.getElementById('select-match');
            try {
                let res = await fetch(API_URL + "?sheet=Jadwal"); matchesData = await res.json();
                select.innerHTML = '<option value="">-- Pilih Pertandingan --</option>';
                matchesData.forEach(m => { let idm = m.id_match || m.ID_Match; if(idm) select.innerHTML += `<option value="${idm}">${m.tim_kiri || m.Tim_Kiri} VS ${m.tim_kanan || m.Tim_Kanan} (${idm})</option>`; });
            } catch(e) { select.innerHTML = '<option value="">Gagal Memuat. Cek Koneksi.</option>'; } 
            finally { document.getElementById('loading-setup').classList.add('hidden'); }
        }

        function updateSetupTeams() {
            let id = document.getElementById('select-match').value; let m = matchesData.find(x => String(x.id_match||x.ID_Match) === id);
            if(m) {
                document.getElementById('label-role-a').innerText = `🛡️ ${(m.tim_kiri||m.Tim_Kiri)}`;
                document.getElementById('label-role-b').innerText = `⚔️ ${(m.tim_kanan||m.Tim_Kanan)}`;
            } else {
                document.getElementById('label-role-a').innerText = `🛡️ Tim Kiri`; document.getElementById('label-role-b').innerText = `⚔️ Tim Kanan`;
            }
        }

        function startSession() {
            let id = document.getElementById('select-match').value; let roleOpt = document.querySelector('input[name="role"]:checked');
            if(!id) return alert("Pilih Laga terlebih dahulu!");
            
            currentMatch = matchesData.find(x => String(x.id_match||x.ID_Match) === id); activeRole = roleOpt.value;
            
            allStates = { '1': createDefaultState(), '2': createDefaultState() };
            let selBabak = document.getElementById('select-babak');
            activeBabak = selBabak ? selBabak.value : '1';
            state = allStates[activeBabak];
            
            saveLocal();
            document.getElementById('screen-setup').classList.add('hidden');
            document.getElementById('screen-tracker').classList.remove('hidden'); 
            document.getElementById('screen-tracker').classList.add('flex');

            buildWorkspace();
            refreshUIfromState();

            if(!isTimerLoopRunning) {
                requestAnimationFrame(timerLoop);
                isTimerLoopRunning = true;
            }
        }

        function refreshUIfromState() {
            STAT_DEFS.forEach(k => { updateStatUI('teamA', k.key); updateStatUI('teamB', k.key); });
            updateStatUI('teamA', 'passSuccess'); updateStatUI('teamA', 'passFail');
            updateStatUI('teamB', 'passSuccess'); updateStatUI('teamB', 'passFail');
            setPossession(state.possession.active);
            
            let curMin = Math.floor(state.timer.totalMs / 60000).toString().padStart(2, '0');
            let curSec = Math.floor((state.timer.totalMs % 60000) / 1000).toString().padStart(2, '0');
            let tm = document.getElementById('match-timer');
            if(tm) tm.innerText = `${curMin}:${curSec}`;
            renderTimerToggleButton();
        }

        // ==============================================
        // BUILD WORKSPACE (H2H UX & ISOLASI PASSING)
        // ==============================================
        function buildWorkspace() {
            let tA = currentMatch.tim_kiri || currentMatch.Tim_Kiri; let tB = currentMatch.tim_kanan || currentMatch.Tim_Kanan;
            document.getElementById('hdr-match-id').innerText = `MATCH ${currentMatch.id_match || currentMatch.ID_Match}`;
            
            let wg = document.getElementById('workspace-container'); wg.innerHTML = ''; 
            let tBtn = document.getElementById('timer-container'); tBtn.classList.add('hidden');

            const renderPossessionPanel = () => {
                return `
                <div class="bg-panel border border-hairline rounded-2xl overflow-hidden shadow-lg w-full max-w-4xl mx-auto mb-6">
                    <div class="bg-gray-800/20 border-b border-hairline p-3 sm:p-4 text-center">
                        <h2 class="text-sm sm:text-lg font-black uppercase tracking-widest text-primary">BALL POSSESSION</h2>
                    </div>
                    <div class="p-4 sm:p-6 flex flex-col items-center gap-6">
                        <div class="grid grid-cols-2 gap-2 sm:gap-4 w-full">
                            <button onclick="setPossession('A')" id="btn-poss-a" class="stat-btn bg-night border border-hairline p-3 sm:p-4 rounded-2xl flex flex-col items-center justify-center gap-2 opacity-50 transition-all">
                                <div class="w-6 h-6 sm:w-8 sm:h-8 rounded-full border-2 border-blue-500 indicator-dot"></div>
                                <span class="text-[10px] sm:text-xs font-bold text-gray-400 uppercase text-center line-clamp-1">${tA}</span>
                            </button>
                            <button onclick="setPossession('B')" id="btn-poss-b" class="stat-btn bg-night border border-hairline p-3 sm:p-4 rounded-2xl flex flex-col items-center justify-center gap-2 opacity-50 transition-all">
                                <div class="w-6 h-6 sm:w-8 sm:h-8 rounded-full border-2 border-red-500 indicator-dot"></div>
                                <span class="text-[10px] sm:text-xs font-bold text-gray-400 uppercase text-center line-clamp-1">${tB}</span>
                            </button>
                            <button onclick="setPossession('N')" id="btn-poss-n" class="stat-btn bg-night border border-hairline p-3 sm:p-4 rounded-2xl flex flex-col items-center justify-center gap-2 opacity-50 transition-all">
                                <div class="w-6 h-6 sm:w-8 sm:h-8 rounded-full border-2 border-gray-400 indicator-dot"></div>
                                <span class="text-[10px] sm:text-xs font-bold text-gray-400 uppercase text-center line-clamp-1">In Contest</span>
                            </button>
                            <button onclick="setPossession('O')" id="btn-poss-o" class="stat-btn bg-night border border-hairline p-3 sm:p-4 rounded-2xl flex flex-col items-center justify-center gap-2 transition-all">
                                <div class="w-6 h-6 sm:w-8 sm:h-8 rounded-full bg-yellow-500 shadow-[0_0_15px_rgba(234,179,8,0.5)] indicator-dot"></div>
                                <span class="text-[10px] sm:text-xs font-bold text-white uppercase text-center line-clamp-1">Bola Out</span>
                            </button>
                        </div>
                        <div class="w-full flex h-3 sm:h-4 rounded-full overflow-hidden bg-night border border-hairline relative">
                            <div id="bar-a" class="poss-bar h-full bg-blue-500" style="width: 0%;"></div>
                            <div id="bar-n" class="poss-bar h-full bg-gray-500" style="width: 0%;"></div>
                            <div id="bar-b" class="poss-bar h-full bg-red-500" style="width: 0%;"></div>
                        </div>
                        <div class="flex w-full justify-between px-1 text-[10px] sm:text-xs font-bold text-gray-400">
                            <span id="pct-a" class="w-1/3 text-left text-blue-400">0%</span>
                            <span id="pct-n" class="w-1/3 text-center text-gray-500">0%</span>
                            <span id="pct-b" class="w-1/3 text-right text-red-400">0%</span>
                        </div>
                    </div>
                </div>`;
            };

            const renderSinglePassingBlock = (teamKey, colorClass, btnBgClass, btnShadowClass) => {
                return `
                <div class="bg-night border border-hairline p-3 sm:p-4 rounded-2xl mb-5 shadow-inner relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-1 bg-${colorClass.replace('text-', '')}/20"></div>
                    <div class="flex justify-between items-center mb-4 border-b border-hairline pb-3">
                        <div class="flex items-center gap-2">
                            <span class="text-xl sm:text-2xl">👟</span>
                            <span class="text-xs sm:text-sm font-black text-gray-300 uppercase tracking-widest">Aktivitas Umpan</span>
                        </div>
                        <span id="passacc-${teamKey}" class="text-2xl sm:text-3xl font-black ${colorClass} font-mono drop-shadow-md">0%</span>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-panel border border-brand-green/20 p-3 sm:p-4 rounded-xl flex flex-col items-center">
                            <span class="text-[10px] sm:text-xs font-bold text-brand-green uppercase mb-3 text-center"><span class="text-lg sm:text-xl">✅</span><br>Sukses</span>
                            <div class="flex justify-between w-full gap-1 items-center">
                                <button onclick="updateStat('${teamKey}', 'passSuccess', -1)" class="stat-btn w-10 h-10 rounded-full bg-night border border-hairline text-gray-500 flex items-center justify-center shrink-0"><i data-lucide="minus" class="w-4 h-4"></i></button>
                                <span id="val-${teamKey}-passSuccess" class="text-xl sm:text-2xl font-black tabular-nums">0</span>
                                <button onclick="updateStat('${teamKey}', 'passSuccess', 1)" class="stat-btn w-14 h-14 rounded-full ${btnBgClass} text-white font-black flex items-center justify-center shrink-0 shadow-[0_4px_15px_${btnShadowClass}]"><i data-lucide="plus" class="w-6 h-6"></i></button>
                            </div>
                        </div>
                        <div class="bg-panel border border-hairline p-3 sm:p-4 rounded-xl flex flex-col items-center">
                            <span class="text-[10px] sm:text-xs font-bold text-gray-400 uppercase mb-3 text-center"><span class="text-lg sm:text-xl">❌</span><br>Gagal</span>
                            <div class="flex justify-between w-full gap-1 items-center">
                                <button onclick="updateStat('${teamKey}', 'passFail', -1)" class="stat-btn w-10 h-10 rounded-full bg-night border border-hairline text-gray-500 flex items-center justify-center shrink-0"><i data-lucide="minus" class="w-4 h-4"></i></button>
                                <span id="val-${teamKey}-passFail" class="text-xl sm:text-2xl font-black tabular-nums">0</span>
                                <button onclick="updateStat('${teamKey}', 'passFail', 1)" class="stat-btn w-12 h-12 rounded-full bg-gray-600 text-white font-black flex items-center justify-center shrink-0 shadow-md"><i data-lucide="plus" class="w-5 h-5"></i></button>
                            </div>
                        </div>
                    </div>
                </div>`;
            };

            const renderSinglePanel = (teamKey, teamName, colorClass, bgClass, btnBgClass, btnShadowClass) => {
                let html = `<div class="bg-panel border border-hairline rounded-2xl overflow-hidden shadow-lg w-full max-w-md mx-auto mb-6">
                    <div class="${bgClass} border-b border-hairline p-3 sm:p-4 text-center">
                        <h2 class="text-sm sm:text-lg font-black uppercase tracking-widest ${colorClass}">${teamName}</h2>
                    </div>
                    <div class="p-3 sm:p-4">`;
                
                html += renderSinglePassingBlock(teamKey, colorClass, btnBgClass, btnShadowClass);

                html += `<div class="space-y-2.5">`;
                STAT_DEFS.forEach((k, index) => {
                    if(index === 0) html += `<div class="text-[9px] sm:text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1.5 mt-2 text-center bg-hairline/30 py-1 rounded">-- TEMBAKAN & PELUANG --</div>`;
                    if(index === 3) html += `<div class="text-[9px] sm:text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1.5 mt-4 text-center bg-hairline/30 py-1 rounded">-- KONDISI & BERTAHAN --</div>`;
                    html += `
                    <div class="flex items-center justify-between bg-night border border-hairline p-2 sm:p-3 rounded-xl">
                        <div class="flex items-center gap-2 w-1/2">
                            <span class="text-base sm:text-lg">${k.emoji}</span>
                            <span class="text-[10px] sm:text-[11px] font-bold uppercase text-gray-300 leading-tight">${k.label}</span>
                        </div>
                        <div class="flex items-center justify-end gap-2 w-1/2">
                            <button onclick="updateStat('${teamKey}', '${k.key}', -1)" class="stat-btn w-9 h-9 sm:w-10 sm:h-10 shrink-0 rounded-full bg-night border border-hairline flex items-center justify-center text-gray-500 hover:text-white"><i data-lucide="minus" class="w-4 h-4"></i></button>
                            <span id="val-${teamKey}-${k.key}" class="text-xl sm:text-2xl font-black w-8 sm:w-10 text-center text-white tabular-nums">0</span>
                            <button onclick="updateStat('${teamKey}', '${k.key}', 1)" class="stat-btn w-10 h-10 sm:w-12 sm:h-12 shrink-0 rounded-full ${btnBgClass} text-white font-black flex items-center justify-center shadow-[0_0_10px_${btnShadowClass}]"><i data-lucide="plus" class="w-5 h-5"></i></button>
                        </div>
                    </div>`;
                });
                html += `</div></div></div>`;
                return html;
            };

            const renderUnifiedPassingBlock = () => {
                return `
                <div class="bg-night border border-hairline rounded-2xl p-3 sm:p-4 mb-5 shadow-inner relative overflow-hidden">
                    <div class="flex justify-between items-center mb-4 border-b border-hairline pb-2">
                        <span id="passacc-teamA" class="w-1/3 text-left text-2xl sm:text-3xl font-black text-blue-400 font-mono">0%</span>
                        <div class="w-1/3 flex flex-col items-center">
                            <span class="text-2xl">👟</span>
                            <span class="text-[8px] sm:text-[10px] font-bold text-gray-400 uppercase tracking-widest text-center mt-1">Akurasi Umpan</span>
                        </div>
                        <span id="passacc-teamB" class="w-1/3 text-right text-2xl sm:text-3xl font-black text-red-400 font-mono">0%</span>
                    </div>

                    <div class="space-y-3">
                        <div class="flex items-center justify-between bg-panel border border-brand-green/20 p-2 sm:p-3 rounded-xl">
                            <div class="flex items-center gap-2 sm:gap-3 shrink-0">
                                <button onclick="updateStat('teamA', 'passSuccess', -1)" class="stat-btn w-10 h-10 bg-night border border-hairline rounded-full flex justify-center items-center text-gray-500 hover:text-white shrink-0"><i data-lucide="minus" class="w-4 h-4"></i></button>
                                <span id="val-teamA-passSuccess" class="w-8 sm:w-10 text-center text-xl sm:text-2xl font-black text-white shrink-0 tabular-nums">0</span>
                                <button onclick="updateStat('teamA', 'passSuccess', 1)" class="stat-btn w-14 h-14 bg-blue-600 rounded-full flex justify-center items-center text-white shadow-[0_4px_15px_rgba(37,99,235,0.4)] shrink-0"><i data-lucide="plus" class="w-6 h-6"></i></button>
                            </div>
                            <div class="flex-1 flex flex-col items-center justify-center text-center px-1">
                                <span class="text-lg sm:text-xl mb-1">✅</span>
                                <span class="text-[8px] sm:text-[10px] font-bold text-brand-green uppercase leading-tight">Umpan Sukses</span>
                            </div>
                            <div class="flex items-center gap-2 sm:gap-3 shrink-0">
                                <button onclick="updateStat('teamB', 'passSuccess', 1)" class="stat-btn w-14 h-14 bg-red-600 rounded-full flex justify-center items-center text-white shadow-[0_4px_15px_rgba(220,38,38,0.4)] shrink-0"><i data-lucide="plus" class="w-6 h-6"></i></button>
                                <span id="val-teamB-passSuccess" class="w-8 sm:w-10 text-center text-xl sm:text-2xl font-black text-white shrink-0 tabular-nums">0</span>
                                <button onclick="updateStat('teamB', 'passSuccess', -1)" class="stat-btn w-10 h-10 bg-night border border-hairline rounded-full flex justify-center items-center text-gray-500 hover:text-white shrink-0"><i data-lucide="minus" class="w-4 h-4"></i></button>
                            </div>
                        </div>
                        
                        <div class="flex items-center justify-between bg-panel border border-hairline p-2 sm:p-3 rounded-xl">
                            <div class="flex items-center gap-2 sm:gap-3 shrink-0">
                                <button onclick="updateStat('teamA', 'passFail', -1)" class="stat-btn w-10 h-10 bg-night border border-hairline rounded-full flex justify-center items-center text-gray-500 hover:text-white shrink-0"><i data-lucide="minus" class="w-4 h-4"></i></button>
                                <span id="val-teamA-passFail" class="w-8 sm:w-10 text-center text-xl sm:text-2xl font-black text-white shrink-0 tabular-nums">0</span>
                                <button onclick="updateStat('teamA', 'passFail', 1)" class="stat-btn w-12 h-12 bg-gray-600 rounded-full flex justify-center items-center text-white shadow-md shrink-0"><i data-lucide="plus" class="w-5 h-5"></i></button>
                            </div>
                            <div class="flex-1 flex flex-col items-center justify-center text-center px-1">
                                <span class="text-lg sm:text-xl mb-1">❌</span>
                                <span class="text-[8px] sm:text-[10px] font-bold text-gray-400 uppercase leading-tight">Umpan Gagal</span>
                            </div>
                            <div class="flex items-center gap-2 sm:gap-3 shrink-0">
                                <button onclick="updateStat('teamB', 'passFail', 1)" class="stat-btn w-12 h-12 bg-gray-600 rounded-full flex justify-center items-center text-white shadow-md shrink-0"><i data-lucide="plus" class="w-5 h-5"></i></button>
                                <span id="val-teamB-passFail" class="w-8 sm:w-10 text-center text-xl sm:text-2xl font-black text-white shrink-0 tabular-nums">0</span>
                                <button onclick="updateStat('teamB', 'passFail', -1)" class="stat-btn w-10 h-10 bg-night border border-hairline rounded-full flex justify-center items-center text-gray-500 hover:text-white shrink-0"><i data-lucide="minus" class="w-4 h-4"></i></button>
                            </div>
                        </div>
                    </div>
                </div>`;
            };

            const renderUnifiedPanel = () => {
                let html = `<div class="bg-panel border border-hairline rounded-2xl overflow-hidden shadow-lg w-full max-w-4xl mx-auto mb-6">
                    <div class="flex justify-between items-center bg-gray-800/20 border-b border-hairline p-3 sm:p-4">
                        <h2 class="w-2/5 text-left text-xs sm:text-base font-black uppercase tracking-widest text-blue-400 truncate pr-2">${tA}</h2>
                        <span class="w-1/5 text-center text-[8px] sm:text-[10px] font-bold text-gray-500 uppercase tracking-widest bg-night px-2 py-1 rounded-full border border-hairline">H2H STATS</span>
                        <h2 class="w-2/5 text-right text-xs sm:text-base font-black uppercase tracking-widest text-red-400 truncate pl-2">${tB}</h2>
                    </div>
                    <div class="p-2 sm:p-4">`;
                
                html += renderUnifiedPassingBlock();

                html += `<div class="space-y-2">`;
                STAT_DEFS.forEach((k, index) => {
                    if(index === 0) html += `<div class="text-[9px] sm:text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1.5 mt-2 text-center bg-hairline/30 py-1 rounded">-- TEMBAKAN & PELUANG --</div>`;
                    if(index === 3) html += `<div class="text-[9px] sm:text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1.5 mt-4 text-center bg-hairline/30 py-1 rounded">-- KONDISI & BERTAHAN --</div>`;
                    html += `
                    <div class="flex items-center justify-between bg-night border border-hairline p-2 sm:p-3 rounded-xl">
                        <div class="flex items-center gap-1 sm:gap-2 shrink-0">
                            <button onclick="updateStat('teamA', '${k.key}', -1)" class="stat-btn w-8 h-8 sm:w-10 sm:h-10 bg-panel border border-hairline rounded-full flex justify-center items-center text-gray-500 hover:text-white shrink-0"><i data-lucide="minus" class="w-3.5 h-3.5"></i></button>
                            <span id="val-teamA-${k.key}" class="w-6 sm:w-8 text-center text-lg sm:text-xl font-black text-white shrink-0 tabular-nums">0</span>
                            <button onclick="updateStat('teamA', '${k.key}', 1)" class="stat-btn w-10 h-10 sm:w-12 sm:h-12 bg-blue-600 rounded-full flex justify-center items-center text-white shadow-[0_4px_15px_rgba(37,99,235,0.4)] shrink-0"><i data-lucide="plus" class="w-4 h-4 sm:w-5 sm:h-5"></i></button>
                        </div>
                        <div class="flex-1 flex flex-col items-center justify-center text-center px-1 overflow-hidden">
                            <span class="text-sm sm:text-base mb-0.5">${k.emoji}</span>
                            <span class="text-[7px] sm:text-[9px] font-bold text-gray-400 uppercase leading-tight truncate w-full">${k.label}</span>
                        </div>
                        <div class="flex items-center gap-1 sm:gap-2 shrink-0">
                            <button onclick="updateStat('teamB', '${k.key}', 1)" class="stat-btn w-10 h-10 sm:w-12 sm:h-12 bg-red-600 rounded-full flex justify-center items-center text-white shadow-[0_4px_15px_rgba(220,38,38,0.4)] shrink-0"><i data-lucide="plus" class="w-4 h-4 sm:w-5 sm:h-5"></i></button>
                            <span id="val-teamB-${k.key}" class="w-6 sm:w-8 text-center text-lg sm:text-xl font-black text-white shrink-0 tabular-nums">0</span>
                            <button onclick="updateStat('teamB', '${k.key}', -1)" class="stat-btn w-8 h-8 sm:w-10 sm:h-10 bg-panel border border-hairline rounded-full flex justify-center items-center text-gray-500 hover:text-white shrink-0"><i data-lucide="minus" class="w-3.5 h-3.5"></i></button>
                        </div>
                    </div>`;
                });
                html += `</div></div></div>`;
                return html;
            };

            if(activeRole === 'teama') {
                document.getElementById('hdr-role').innerText = "🛡️ OPR. " + tA;
                wg.innerHTML = renderSinglePanel('teamA', tA, 'text-blue-400', 'bg-blue-900/20', 'bg-blue-600', 'rgba(37,99,235,0.4)');
            } 
            else if (activeRole === 'teamb') {
                document.getElementById('hdr-role').innerText = "⚔️ OPR. " + tB;
                wg.innerHTML = renderSinglePanel('teamB', tB, 'text-red-400', 'bg-red-900/20', 'bg-red-600', 'rgba(220,38,38,0.4)');
            } 
            else if (activeRole === 'possession') {
                document.getElementById('hdr-role').innerText = "⏱️ PENGUASAAN";
                tBtn.classList.remove('hidden');
                wg.innerHTML = renderPossessionPanel();
            } 
            else if (activeRole === 'twoteams') {
                document.getElementById('hdr-role').innerText = "⚖️ OP. 2 TIM";
                wg.innerHTML = renderUnifiedPanel();
            } 
            else if (activeRole === 'master') {
                document.getElementById('hdr-role').innerText = "👑 MASTER";
                tBtn.classList.remove('hidden');
                wg.innerHTML = renderPossessionPanel() + renderUnifiedPanel();
            }

            lucide.createIcons();
            
            let curMin = Math.floor(state.timer.totalMs / 60000).toString().padStart(2, '0');
            let curSec = Math.floor((state.timer.totalMs % 60000) / 1000).toString().padStart(2, '0');
            document.getElementById('match-timer').innerText = `${curMin}:${curSec}`;
            renderTimerToggleButton();
        }

        // ==============================================
        // LOGIK STATISTIK & POSSESSION
        // ==============================================
        function updateStat(team, stat, mod) {
            state[team][stat] += mod;
            if (state[team][stat] < 0) state[team][stat] = 0;
            updateStatUI(team, stat);
            saveLocal(); 
        }

        function updateStatUI(team, stat) {
            let el = document.getElementById(`val-${team}-${stat}`);
            if(el) {
                el.innerText = state[team][stat];
                el.classList.remove('animate-pop');
                void el.offsetWidth; 
                el.classList.add('animate-pop');
            }

            if(stat === 'passSuccess' || stat === 'passFail') {
                let s = state[team].passSuccess; let f = state[team].passFail;
                let acc = (s+f) === 0 ? 0 : Math.round((s / (s+f)) * 100);
                let accEl = document.getElementById(`passacc-${team}`);
                if(accEl) accEl.innerText = `${acc}%`;
            }
        }

        function setPossession(team) {
            state.possession.active = team;
            
            let bA = document.getElementById('btn-poss-a'); 
            let bN = document.getElementById('btn-poss-n'); 
            let bO = document.getElementById('btn-poss-o'); 
            let bB = document.getElementById('btn-poss-b');

            [bA, bN, bO, bB].forEach(b => {
                if(b) {
                    b.classList.add('opacity-50'); 
                    b.querySelector('.indicator-dot').className = "w-6 h-6 sm:w-8 sm:h-8 rounded-full border-2 indicator-dot border-gray-600";
                    b.querySelector('span').classList.remove('text-white'); b.querySelector('span').classList.add('text-gray-400');
                }
            });

            if(team === 'A' && bA) { 
                bA.classList.remove('opacity-50'); 
                bA.querySelector('.indicator-dot').className = "w-6 h-6 sm:w-8 sm:h-8 rounded-full bg-blue-500 indicator-dot shadow-[0_0_15px_rgba(59,130,246,0.6)]"; 
                bA.querySelector('span').classList.add('text-white'); bA.querySelector('span').classList.remove('text-gray-400');
            } else if(team === 'N' && bN) { 
                bN.classList.remove('opacity-50'); 
                bN.querySelector('.indicator-dot').className = "w-6 h-6 sm:w-8 sm:h-8 rounded-full bg-gray-400 indicator-dot shadow-[0_0_15px_rgba(156,163,175,0.6)]"; 
                bN.querySelector('span').classList.add('text-white'); bN.querySelector('span').classList.remove('text-gray-400');
            } else if(team === 'O' && bO) { 
                bO.classList.remove('opacity-50'); 
                bO.querySelector('.indicator-dot').className = "w-6 h-6 sm:w-8 sm:h-8 rounded-full bg-yellow-500 indicator-dot shadow-[0_0_15px_rgba(234,179,8,0.6)]"; 
                bO.querySelector('span').classList.add('text-white'); bO.querySelector('span').classList.remove('text-gray-400');
            } else if(team === 'B' && bB) { 
                bB.classList.remove('opacity-50'); 
                bB.querySelector('.indicator-dot').className = "w-6 h-6 sm:w-8 sm:h-8 rounded-full bg-red-500 indicator-dot shadow-[0_0_15px_rgba(239,68,68,0.6)]"; 
                bB.querySelector('span').classList.add('text-white'); bB.querySelector('span').classList.remove('text-gray-400');
            }
            updatePossessionUI();
            saveLocal();
        }

        function toggleTimer() {
            state.timer.isRunning = !state.timer.isRunning;
            if(state.timer.isRunning) state.timer.lastTick = performance.now();
            renderTimerToggleButton();
            saveLocal();
        }

        function renderTimerToggleButton() {
            let icon = document.getElementById('icon-timer'); let btn = document.getElementById('btn-timer');
            if(!btn || !icon) return;
            if(state.timer.isRunning) {
                btn.classList.replace('bg-white', 'bg-brand-red'); btn.classList.replace('text-black', 'text-white');
                icon.setAttribute('data-lucide', 'square');
            } else {
                btn.classList.replace('bg-brand-red', 'bg-white'); btn.classList.replace('text-white', 'text-black');
                icon.setAttribute('data-lucide', 'play');
            }
            lucide.createIcons({ nameAttr: 'data-lucide' });
        }

        function timerLoop(now) {
            if (state.timer.isRunning) {
                let delta = now - state.timer.lastTick;
                state.timer.totalMs += delta;
                
                if (state.possession.active === 'A') state.possession.timeA_ms += delta;
                else if (state.possession.active === 'B') state.possession.timeB_ms += delta;
                else if (state.possession.active === 'N') state.possession.timeN_ms += delta;
                else if (state.possession.active === 'O') state.possession.timeO_ms += delta; // Menyerap waktu saat bola keluar

                state.timer.lastTick = now;

                let totalSec = Math.floor(state.timer.totalMs / 1000);
                let m = String(Math.floor(totalSec / 60)).padStart(2, '0');
                let s = String(totalSec % 60).padStart(2, '0');
                let tm = document.getElementById('match-timer');
                if(tm) tm.innerText = `${m}:${s}`;

                if (totalSec % 1 === 0) {
                    updatePossessionUI();
                    if(totalSec % 5 === 0) saveLocal();
                }
            }
            requestAnimationFrame(timerLoop);
        }

        function updatePossessionUI() {
            let p = state.possession; 
            // TOTAL WAKTU AKTIF (Hanya menghitung saat bola di dalam lapangan)
            let activeTime = p.timeA_ms + p.timeB_ms + p.timeN_ms;
            
            let pctA = 0, pctN = 0, pctB = 0;
            if (activeTime > 0) {
                pctA = Math.round((p.timeA_ms / activeTime) * 100);
                pctB = Math.round((p.timeB_ms / activeTime) * 100);
                pctN = 100 - (pctA + pctB);
            }

            let barA = document.getElementById('bar-a'); if(barA) barA.style.width = `${pctA}%`; 
            let barN = document.getElementById('bar-n'); if(barN) barN.style.width = `${pctN}%`; 
            let barB = document.getElementById('bar-b'); if(barB) barB.style.width = `${pctB}%`;
            
            let lblA = document.getElementById('pct-a'); if(lblA) lblA.innerText = `${pctA}%`; 
            let lblN = document.getElementById('pct-n'); if(lblN) lblN.innerText = `${pctN}%`; 
            let lblB = document.getElementById('pct-b'); if(lblB) lblB.innerText = `${pctB}%`;
        }

        // ==============================================
        // INTEGRASI API (KIRIM KE GOOGLE SHEETS)
        // ==============================================
        async function submitStatsToDB() {
            let btn = document.getElementById('btn-sync');
            btn.disabled = true;
            btn.innerHTML = `<div class="w-3.5 h-3.5 sm:w-4 sm:h-4 border-2 border-white/20 border-t-white rounded-full animate-spin"></div>`;

            let p = state.possession; // <--- AMBIL DATA WAKTU MURNI (MS)

            let payloadData = {
                id_match: currentMatch.id_match || currentMatch.ID_Match,
                babak: activeBabak, 
                role: activeRole,
                tim_kiri: currentMatch.tim_kiri || currentMatch.Tim_Kiri,
                tim_kanan: currentMatch.tim_kanan || currentMatch.Tim_Kanan,
                stats: {}
            };

            if(['teama', 'master', 'twoteams'].includes(activeRole)) payloadData.stats.teamA = state.teamA;
            if(['teamb', 'master', 'twoteams'].includes(activeRole)) payloadData.stats.teamB = state.teamB;
            
            // INJEKSI FIFA STANDARD: Kirim Waktu Murni (Bukan Persentase) ke Database
            if(['possession', 'master'].includes(activeRole)) {
                payloadData.stats.possession = { a: p.timeA_ms, b: p.timeB_ms, n: p.timeN_ms };
            }

            try {
                await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'submit_stat_match', payload: payloadData }) });
                let log = document.getElementById('log-status');
                log.classList.remove('hidden'); setTimeout(() => log.classList.add('hidden'), 3000);
                saveLocal(); 
            } catch(e) { alert("Gagal sinkronisasi data! Silakan periksa koneksi internet Anda."); } 
            finally {
                btn.disabled = false; btn.innerHTML = `<i data-lucide="cloud-upload" class="w-3.5 h-3.5 shrink-0"></i> <span class="hidden sm:inline">Sync Data</span><span class="sm:hidden">Sync</span>`; lucide.createIcons();
            }
        }
        
        window.onload = fetchMatches;
    </script>
</body>
</html>
