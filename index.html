<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TSL Pro Stat-Maker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'night': '#0D1512', 'panel': '#131F1A', 'panel2': '#17251F',
                        'hairline': '#24352C', 'primary': '#F5F7F5', 'brand-green': '#009A44',
                        'brand-gold': '#d7b67d', 'contest': '#6B7280'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0D1512; color: #F5F7F5; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .stat-btn { transition: all 0.1s; }
        .stat-btn:active { transform: scale(0.95); }
        .loader { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #009A44; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .poss-bar { transition: width 0.3s ease-out; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div id="screen-setup" class="flex-1 flex flex-col items-center justify-center p-6 max-w-md mx-auto w-full">
        <div class="mb-8 text-center">
            <h1 class="text-2xl font-black uppercase tracking-widest text-brand-green flex items-center justify-center gap-2">
                <i data-lucide="bar-chart-2" class="w-7 h-7"></i> STAT-MAKER
            </h1>
            <p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest mt-1">Sistem Statistik Terdistribusi TSL</p>
        </div>

        <div id="loading-setup" class="flex flex-col items-center py-10 hidden">
            <div class="loader mb-4"></div>
            <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">Sinkronisasi Jadwal...</p>
        </div>

        <div id="form-setup" class="w-full space-y-5 bg-panel border border-hairline p-6 rounded-2xl shadow-xl">
            <div>
                <label class="block text-[10px] text-gray-400 font-bold uppercase mb-2">1. Pilih Laga Aktif</label>
                <select id="select-match" onchange="updateSetupTeams()" class="w-full bg-night border border-hairline rounded-xl px-4 py-3 text-xs font-bold uppercase outline-none focus:border-brand-green transition-colors text-brand-gold">
                    <option value="">-- MEMUAT DATA... --</option>
                </select>
            </div>
            
            <div>
                <label class="block text-[10px] text-gray-400 font-bold uppercase mb-2">2. Pilih Peran Terminal (Role)</label>
                <div class="grid grid-cols-1 gap-2">
                    <label class="flex items-center gap-3 p-3 border border-hairline bg-night rounded-xl cursor-pointer hover:border-brand-green transition-colors">
                        <input type="radio" name="role" value="possession" class="w-4 h-4 text-brand-green accent-brand-green" checked>
                        <div>
                            <span class="block text-[11px] font-bold uppercase">⏱️ Operator Penguasaan</span>
                            <span class="block text-[9px] text-gray-500 font-medium">Timer & Ball Possession (Netral)</span>
                        </div>
                    </label>
                    <label class="flex items-center gap-3 p-3 border border-hairline bg-night rounded-xl cursor-pointer hover:border-brand-green transition-colors">
                        <input type="radio" name="role" value="teama" class="w-4 h-4 text-brand-green accent-brand-green">
                        <div>
                            <span class="block text-[11px] font-bold uppercase text-blue-400" id="label-role-a">🛡️ Operator Tim Kiri</span>
                            <span class="block text-[9px] text-gray-500 font-medium">Ofensif & Defensif Tim Kiri</span>
                        </div>
                    </label>
                    <label class="flex items-center gap-3 p-3 border border-hairline bg-night rounded-xl cursor-pointer hover:border-brand-green transition-colors">
                        <input type="radio" name="role" value="teamb" class="w-4 h-4 text-brand-green accent-brand-green">
                        <div>
                            <span class="block text-[11px] font-bold uppercase text-red-400" id="label-role-b">⚔️ Operator Tim Kanan</span>
                            <span class="block text-[9px] text-gray-500 font-medium">Ofensif & Defensif Tim Kanan</span>
                        </div>
                    </label>
                    <label class="flex items-center gap-3 p-3 border border-hairline bg-night rounded-xl cursor-pointer hover:border-brand-gold transition-colors">
                        <input type="radio" name="role" value="master" class="w-4 h-4 text-brand-gold accent-brand-gold">
                        <div>
                            <span class="block text-[11px] font-bold uppercase text-brand-gold">👑 Mode Master (Semua)</span>
                            <span class="block text-[9px] text-gray-500 font-medium">Kendalikan 3 panel sekaligus</span>
                        </div>
                    </label>
                </div>
            </div>

            <button onclick="startSession()" class="w-full bg-brand-green text-white font-black text-xs uppercase tracking-widest py-3.5 rounded-xl mt-4 shadow-[0_0_15px_rgba(0,154,68,0.3)] hover:bg-green-600 transition-colors">
                Mulai Terminal
            </button>
        </div>
    </div>

    <div id="screen-tracker" class="hidden flex-1 flex flex-col h-screen overflow-hidden">
        
        <header class="bg-panel border-b border-hairline p-3 md:p-4 flex items-center justify-between shrink-0 z-20 shadow-md">
            <div class="flex flex-col">
                <span id="hdr-match-id" class="text-[9px] font-bold text-gray-500 uppercase tracking-widest">MATCH M01</span>
                <span id="hdr-role" class="text-[11px] font-black text-brand-gold uppercase tracking-wider">👑 MASTER MODE</span>
            </div>
            
            <div class="flex items-center gap-4">
                <div id="timer-container" class="hidden flex items-center gap-3 bg-night border border-hairline px-3 py-1.5 rounded-lg">
                    <span id="match-timer" class="text-xl font-black tracking-tighter w-16 text-center font-mono">00:00</span>
                    <button id="btn-timer" onclick="toggleTimer()" class="w-8 h-8 rounded-full bg-white text-black flex items-center justify-center hover:bg-brand-green hover:text-white transition-colors">
                        <i data-lucide="play" id="icon-timer" class="w-4 h-4 ml-0.5"></i>
                    </button>
                </div>
                
                <button onclick="submitStatsToDB()" id="btn-sync" class="bg-brand-green/20 text-brand-green border border-brand-green/50 px-3 py-2 rounded-lg text-[10px] font-bold uppercase tracking-widest flex items-center gap-2 hover:bg-brand-green hover:text-white transition-colors">
                    <i data-lucide="cloud-upload" class="w-3.5 h-3.5"></i> <span>Sync</span>
                </button>
            </div>
        </header>

        <div id="workspace-grid" class="flex-1 overflow-y-auto p-4 md:p-6 grid gap-6 grid-cols-1 md:grid-cols-3 items-start">
            
            <div id="panel-teama" class="hidden bg-panel border border-hairline rounded-2xl overflow-hidden shadow-lg pb-4">
                <div class="bg-blue-900/20 border-b border-blue-900/30 p-4 text-center">
                    <h2 id="name-teama" class="text-lg font-black uppercase tracking-widest text-blue-400">TIM KIRI</h2>
                    <span class="text-[9px] font-bold text-gray-400 uppercase tracking-widest">Statistik Utama</span>
                </div>
                <div id="stats-grid-a" class="p-4 grid grid-cols-1 gap-2.5"></div>
                <div class="px-4 mt-2">
                    <div class="bg-blue-900/10 border border-blue-900/30 p-3 rounded-xl mb-3 flex justify-between items-center">
                        <span class="text-[10px] font-bold text-blue-400 uppercase tracking-widest">Akurasi Passing</span>
                        <span id="passacc-teama" class="text-xl font-black text-white font-mono">0%</span>
                    </div>
                    <div id="pass-grid-a" class="grid grid-cols-1 gap-2.5"></div>
                </div>
            </div>

            <div id="panel-possession" class="hidden bg-panel border border-hairline rounded-2xl overflow-hidden shadow-lg">
                <div class="bg-gray-800/20 border-b border-hairline p-4 text-center">
                    <h2 class="text-lg font-black uppercase tracking-widest text-primary">BALL POSSESSION</h2>
                    <span class="text-[9px] font-bold text-gray-400 uppercase tracking-widest">Distribusi Timer & Netral</span>
                </div>
                
                <div class="p-6 flex flex-col items-center gap-8">
                    <div class="w-full flex h-4 rounded-full overflow-hidden bg-night border border-hairline relative">
                        <div id="bar-a" class="poss-bar h-full bg-blue-500" style="width: 33.3%;"></div>
                        <div id="bar-n" class="poss-bar h-full bg-gray-500" style="width: 33.3%;"></div>
                        <div id="bar-b" class="poss-bar h-full bg-red-500" style="width: 33.4%;"></div>
                    </div>
                    
                    <div class="flex w-full justify-between px-2">
                        <div class="text-center">
                            <span id="pct-a" class="block text-2xl font-black text-blue-400">33%</span>
                            <span id="lbl-poss-a" class="text-[9px] font-bold text-gray-500 uppercase truncate w-20 block">TIM A</span>
                        </div>
                        <div class="text-center">
                            <span id="pct-n" class="block text-2xl font-black text-gray-400">33%</span>
                            <span class="text-[9px] font-bold text-gray-500 uppercase">IN CONTEST</span>
                        </div>
                        <div class="text-center">
                            <span id="pct-b" class="block text-2xl font-black text-red-400">34%</span>
                            <span id="lbl-poss-b" class="text-[9px] font-bold text-gray-500 uppercase truncate w-20 block">TIM B</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 w-full gap-3">
                        <button onclick="setPossession('A')" id="btn-poss-a" class="stat-btn p-4 rounded-xl border border-hairline bg-night text-left flex justify-between items-center opacity-50">
                            <span class="font-bold text-xs uppercase text-gray-300" id="btn-lbl-poss-a">Kuasai Bola</span>
                            <div class="w-4 h-4 rounded-full border border-blue-500 indicator-dot"></div>
                        </button>
                        <button onclick="setPossession('N')" id="btn-poss-n" class="stat-btn p-4 rounded-xl border border-hairline bg-night text-left flex justify-between items-center">
                            <span class="font-bold text-xs uppercase text-gray-300">In Contest (Netral)</span>
                            <div class="w-4 h-4 rounded-full bg-gray-500 indicator-dot shadow-[0_0_10px_rgba(107,114,128,0.5)]"></div>
                        </button>
                        <button onclick="setPossession('B')" id="btn-poss-b" class="stat-btn p-4 rounded-xl border border-hairline bg-night text-left flex justify-between items-center opacity-50">
                            <span class="font-bold text-xs uppercase text-gray-300" id="btn-lbl-poss-b">Kuasai Bola</span>
                            <div class="w-4 h-4 rounded-full border border-red-500 indicator-dot"></div>
                        </button>
                    </div>
                </div>
            </div>

            <div id="panel-teamb" class="hidden bg-panel border border-hairline rounded-2xl overflow-hidden shadow-lg pb-4">
                <div class="bg-red-900/20 border-b border-red-900/30 p-4 text-center">
                    <h2 id="name-teamb" class="text-lg font-black uppercase tracking-widest text-red-400">TIM KANAN</h2>
                    <span class="text-[9px] font-bold text-gray-400 uppercase tracking-widest">Statistik Utama</span>
                </div>
                <div id="stats-grid-b" class="p-4 grid grid-cols-1 gap-2.5"></div>
                <div class="px-4 mt-2">
                    <div class="bg-red-900/10 border border-red-900/30 p-3 rounded-xl mb-3 flex justify-between items-center">
                        <span class="text-[10px] font-bold text-red-400 uppercase tracking-widest">Akurasi Passing</span>
                        <span id="passacc-teamb" class="text-xl font-black text-white font-mono">0%</span>
                    </div>
                    <div id="pass-grid-b" class="grid grid-cols-1 gap-2.5"></div>
                </div>
            </div>
            
        </div>
        
        <div id="log-status" class="bg-brand-green/10 text-brand-green text-center text-[10px] font-bold uppercase tracking-widest p-2 hidden">
            Data Berhasil Diunggah!
        </div>
    </div>

    <script>
        lucide.createIcons();
        
        // KONFIGURASI API & STATE
        const API_URL = "https://script.google.com/macros/s/AKfycbzAeXyhA-VIDTJQfmOnPfv0o9NZQXJg9PIk1r1FpSWeqH3TvInjK6QnhONhLieHiqY/exec";
        
        let matchesData = [];
        let currentMatch = null;
        let activeRole = 'possession';

        // DEFINISI 11 TITIK DATA SESUAI FILE INDEX (39)
        const STAT_DEFS = [
            { key: 'goals',       label: 'Gol', emoji: '⚽' },
            { key: 'shotsOn',     label: 'SOT (Tepat Sasaran)', emoji: '🎯' },
            { key: 'shotsOff',    label: 'Tembakan Melenceng', emoji: '↗️' },
            { key: 'corners',     label: 'Tendangan Sudut', emoji: '⛳' },
            { key: 'offsides',    label: 'Offside', emoji: '🚩' },
            { key: 'yellowCards', label: 'Kartu Kuning', emoji: '🟨' },
            { key: 'redCards',    label: 'Kartu Merah', emoji: '🟥' },
            { key: 'fouls',       label: 'Pelanggaran', emoji: '🛑' },
            { key: 'saves',       label: 'Peny. Kiper', emoji: '🧤' }
        ];

        const PASS_DEFS = [
            { key: 'passSuccess', label: 'Umpan Sukses', emoji: '✅' },
            { key: 'passFail',    label: 'Umpan Gagal', emoji: '❌' }
        ];

        function createEmptyStats() {
            return { goals: 0, shotsOn: 0, shotsOff: 0, corners: 0, offsides: 0, yellowCards: 0, redCards: 0, fouls: 0, saves: 0, passSuccess: 0, passFail: 0 };
        }

        let state = {
            teamA: createEmptyStats(),
            teamB: createEmptyStats(),
            possession: { active: 'N', timeA_ms: 0, timeB_ms: 0, timeN_ms: 0 },
            timer: { isRunning: false, totalMs: 0, lastTick: 0 }
        };

        // ==============================================
        // TAHAP 1: INISIALISASI & SETUP
        // ==============================================
        async function fetchMatches() {
            document.getElementById('loading-setup').classList.remove('hidden');
            let select = document.getElementById('select-match');
            try {
                let res = await fetch(API_URL + "?sheet=Jadwal");
                matchesData = await res.json();
                
                select.innerHTML = '<option value="">-- Pilih Pertandingan --</option>';
                matchesData.forEach(m => { 
                    let idm = m.id_match || m.ID_Match; 
                    if(idm) select.innerHTML += `<option value="${idm}">${m.tim_kiri || m.Tim_Kiri} VS ${m.tim_kanan || m.Tim_Kanan} (${idm})</option>`; 
                });
            } catch(e) { select.innerHTML = '<option value="">Gagal Memuat. Cek Koneksi.</option>'; } 
            finally { document.getElementById('loading-setup').classList.add('hidden'); }
        }

        function updateSetupTeams() {
            let id = document.getElementById('select-match').value;
            let m = matchesData.find(x => String(x.id_match||x.ID_Match) === id);
            if(m) {
                document.getElementById('label-role-a').innerText = `🛡️ Op. ${(m.tim_kiri||m.Tim_Kiri)}`;
                document.getElementById('label-role-b').innerText = `⚔️ Op. ${(m.tim_kanan||m.Tim_Kanan)}`;
            } else {
                document.getElementById('label-role-a').innerText = `🛡️ Operator Tim Kiri`;
                document.getElementById('label-role-b').innerText = `⚔️ Operator Tim Kanan`;
            }
        }

        function startSession() {
            let id = document.getElementById('select-match').value;
            let roleOpt = document.querySelector('input[name="role"]:checked');
            if(!id) return alert("Pilih Laga terlebih dahulu!");
            
            currentMatch = matchesData.find(x => String(x.id_match||x.ID_Match) === id);
            activeRole = roleOpt.value;

            document.getElementById('screen-setup').classList.add('hidden');
            document.getElementById('screen-tracker').classList.remove('hidden');
            document.getElementById('screen-tracker').classList.add('flex');

            buildWorkspace();
        }

        // ==============================================
        // TAHAP 2: BUILD WORKSPACE (ROLE-BASED UI)
        // ==============================================
        function buildWorkspace() {
            let tA = currentMatch.tim_kiri || currentMatch.Tim_Kiri;
            let tB = currentMatch.tim_kanan || currentMatch.Tim_Kanan;
            
            document.getElementById('hdr-match-id').innerText = `MATCH ${currentMatch.id_match || currentMatch.ID_Match}`;
            
            let pA = document.getElementById('panel-teama'); let pB = document.getElementById('panel-teamb');
            let pPoss = document.getElementById('panel-possession'); let tBtn = document.getElementById('timer-container');

            document.getElementById('name-teama').innerText = tA; document.getElementById('name-teamb').innerText = tB;
            document.getElementById('lbl-poss-a').innerText = tA; document.getElementById('lbl-poss-b').innerText = tB;
            document.getElementById('btn-lbl-poss-a').innerText = tA; document.getElementById('btn-lbl-poss-b').innerText = tB;

            pA.classList.add('hidden'); pB.classList.add('hidden'); pPoss.classList.add('hidden'); tBtn.classList.add('hidden');
            
            if(activeRole === 'teama') {
                pA.classList.remove('hidden'); document.getElementById('workspace-grid').className = "flex-1 overflow-y-auto p-4 md:p-6 flex justify-center";
                pA.classList.add('w-full', 'max-w-md'); document.getElementById('hdr-role').innerText = "🛡️ OPR. " + tA;
            } else if (activeRole === 'teamb') {
                pB.classList.remove('hidden'); document.getElementById('workspace-grid').className = "flex-1 overflow-y-auto p-4 md:p-6 flex justify-center";
                pB.classList.add('w-full', 'max-w-md'); document.getElementById('hdr-role').innerText = "⚔️ OPR. " + tB;
            } else if (activeRole === 'possession') {
                pPoss.classList.remove('hidden'); tBtn.classList.remove('hidden'); document.getElementById('workspace-grid').className = "flex-1 overflow-y-auto p-4 md:p-6 flex justify-center";
                pPoss.classList.add('w-full', 'max-w-md'); document.getElementById('hdr-role').innerText = "⏱️ OPR. POSSESSION";
            } else if (activeRole === 'master') {
                pA.classList.remove('hidden'); pB.classList.remove('hidden'); pPoss.classList.remove('hidden'); tBtn.classList.remove('hidden');
                document.getElementById('hdr-role').innerText = "👑 MASTER MODE";
            }

            // Fungsi Pembangun Tombol +/-
            const buildCounters = (teamKey, dict) => {
                let html = '';
                dict.forEach(k => {
                    html += `
                    <div class="flex items-center justify-between bg-night border border-hairline p-2.5 rounded-xl">
                        <span class="text-[10px] sm:text-[11px] font-bold uppercase text-gray-300 w-1/2 flex items-center gap-2"><span class="text-sm">${k.emoji}</span> ${k.label}</span>
                        <div class="flex items-center gap-2.5">
                            <button onclick="updateStat('${teamKey}', '${k.key}', -1)" class="w-7 h-7 rounded-full bg-white/5 border border-white/10 flex items-center justify-center hover:bg-white/20 active:scale-95 transition-all text-white"><i data-lucide="minus" class="w-3.5 h-3.5"></i></button>
                            <span id="val-${teamKey}-${k.key}" class="text-lg font-black w-6 text-center text-white">0</span>
                            <button onclick="updateStat('${teamKey}', '${k.key}', 1)" class="w-7 h-7 rounded-full bg-white text-black font-black flex items-center justify-center hover:bg-gray-200 active:scale-95 transition-all"><i data-lucide="plus" class="w-3.5 h-3.5"></i></button>
                        </div>
                    </div>`;
                });
                return html;
            };

            document.getElementById('stats-grid-a').innerHTML = buildCounters('teamA', STAT_DEFS);
            document.getElementById('stats-grid-b').innerHTML = buildCounters('teamB', STAT_DEFS);
            document.getElementById('pass-grid-a').innerHTML = buildCounters('teamA', PASS_DEFS);
            document.getElementById('pass-grid-b').innerHTML = buildCounters('teamB', PASS_DEFS);
            lucide.createIcons();

            requestAnimationFrame(timerLoop);
        }

        // ==============================================
        // TAHAP 3: LOGIK STATISTIK & POSSESSION
        // ==============================================
        function updateStat(team, stat, mod) {
            state[team][stat] += mod;
            if (state[team][stat] < 0) state[team][stat] = 0;
            document.getElementById(`val-${team}-${stat}`).innerText = state[team][stat];

            // Auto-Kalkulasi Akurasi Passing
            if(stat === 'passSuccess' || stat === 'passFail') {
                let s = state[team].passSuccess; let f = state[team].passFail;
                let total = s + f;
                let acc = total === 0 ? 0 : Math.round((s / total) * 100);
                document.getElementById(`passacc-${team}`).innerText = `${acc}%`;
            }
        }

        function setPossession(team) {
            state.possession.active = team;
            
            let bA = document.getElementById('btn-poss-a'); let bN = document.getElementById('btn-poss-n'); let bB = document.getElementById('btn-poss-b');
            [bA, bN, bB].forEach(b => {
                b.classList.add('opacity-50'); 
                b.querySelector('.indicator-dot').className = "w-4 h-4 rounded-full border indicator-dot border-gray-600";
            });

            if(team === 'A') { 
                bA.classList.remove('opacity-50'); 
                bA.querySelector('.indicator-dot').className = "w-4 h-4 rounded-full bg-blue-500 indicator-dot shadow-[0_0_10px_rgba(59,130,246,0.5)]"; 
            } else if(team === 'N') { 
                bN.classList.remove('opacity-50'); 
                bN.querySelector('.indicator-dot').className = "w-4 h-4 rounded-full bg-gray-500 indicator-dot shadow-[0_0_10px_rgba(107,114,128,0.5)]"; 
            } else if(team === 'B') { 
                bB.classList.remove('opacity-50'); 
                bB.querySelector('.indicator-dot').className = "w-4 h-4 rounded-full bg-red-500 indicator-dot shadow-[0_0_10px_rgba(239,68,68,0.5)]"; 
            }
            updatePossessionUI();
        }

        function toggleTimer() {
            state.timer.isRunning = !state.timer.isRunning;
            let icon = document.getElementById('icon-timer'); let btn = document.getElementById('btn-timer');
            
            if(state.timer.isRunning) {
                state.timer.lastTick = performance.now();
                btn.classList.replace('bg-white', 'bg-brand-red'); btn.classList.replace('text-black', 'text-white');
                btn.style.backgroundColor = '#ef4444'; icon.setAttribute('data-lucide', 'square');
            } else {
                btn.style.backgroundColor = 'white'; btn.classList.replace('text-white', 'text-black');
                icon.setAttribute('data-lucide', 'play');
            }
            lucide.createIcons();
        }

        function timerLoop(now) {
            if (state.timer.isRunning) {
                let delta = now - state.timer.lastTick;
                state.timer.totalMs += delta;
                
                if (state.possession.active === 'A') state.possession.timeA_ms += delta;
                else if (state.possession.active === 'B') state.possession.timeB_ms += delta;
                else if (state.possession.active === 'N') state.possession.timeN_ms += delta;

                state.timer.lastTick = now;

                let totalSec = Math.floor(state.timer.totalMs / 1000);
                let m = String(Math.floor(totalSec / 60)).padStart(2, '0');
                let s = String(totalSec % 60).padStart(2, '0');
                document.getElementById('match-timer').innerText = `${m}:${s}`;

                if (totalSec % 1 === 0) updatePossessionUI();
            }
            requestAnimationFrame(timerLoop);
        }

        function updatePossessionUI() {
            let p = state.possession; let total = p.timeA_ms + p.timeB_ms + p.timeN_ms;
            let pctA = 33, pctN = 34, pctB = 33;
            if (total > 0) {
                pctA = Math.round((p.timeA_ms / total) * 100);
                pctB = Math.round((p.timeB_ms / total) * 100);
                pctN = 100 - (pctA + pctB);
            }

            document.getElementById('bar-a').style.width = `${pctA}%`; document.getElementById('bar-n').style.width = `${pctN}%`; document.getElementById('bar-b').style.width = `${pctB}%`;
            document.getElementById('pct-a').innerText = `${pctA}%`; document.getElementById('pct-n').innerText = `${pctN}%`; document.getElementById('pct-b').innerText = `${pctB}%`;
        }

        // ==============================================
        // TAHAP 4: INTEGRASI API (KIRIM KE GOOGLE SHEETS)
        // ==============================================
        async function submitStatsToDB() {
            let btn = document.getElementById('btn-sync');
            btn.disabled = true;
            btn.innerHTML = `<div class="w-3 h-3 border-2 border-white/20 border-t-white rounded-full animate-spin"></div> <span>Syncing...</span>`;

            let p = state.possession; let total = p.timeA_ms + p.timeB_ms + p.timeN_ms;
            let pctA = total > 0 ? Math.round((p.timeA_ms / total) * 100) : 50;
            let pctB = total > 0 ? Math.round((p.timeB_ms / total) * 100) : 50;

            let payloadData = {
                id_match: currentMatch.id_match || currentMatch.ID_Match,
                role: activeRole,
                tim_kiri: currentMatch.tim_kiri || currentMatch.Tim_Kiri,
                tim_kanan: currentMatch.tim_kanan || currentMatch.Tim_Kanan,
                stats: {}
            };

            if(activeRole === 'teama' || activeRole === 'master') payloadData.stats.teamA = state.teamA;
            if(activeRole === 'teamb' || activeRole === 'master') payloadData.stats.teamB = state.teamB;
            if(activeRole === 'possession' || activeRole === 'master') payloadData.stats.possession = { a: pctA, b: pctB, n: (100 - (pctA + pctB)) };

            try {
                await fetch(API_URL, { 
                    method: 'POST', 
                    body: JSON.stringify({ action: 'submit_stat_match', payload: payloadData }) 
                });
                let log = document.getElementById('log-status');
                log.classList.remove('hidden'); setTimeout(() => log.classList.add('hidden'), 3000);
            } catch(e) { alert("Gagal sinkronisasi data!"); } 
            finally {
                btn.disabled = false; btn.innerHTML = `<i data-lucide="cloud-upload" class="w-3.5 h-3.5"></i> <span>Sync</span>`; lucide.createIcons();
            }
        }

        window.onload = fetchMatches;
    </script>
</body>
